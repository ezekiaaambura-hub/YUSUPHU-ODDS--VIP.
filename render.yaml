services:
  - type: web
    name: yusuphu-odds-vip
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yusuphu-odds-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_PHONE
        value: "0793401886"
      - key: VIP_PRICE
        value: "5000"

databases:
  - name: yusuphu-odds-db
    databaseName: yusuphu_odds
    plan: free
